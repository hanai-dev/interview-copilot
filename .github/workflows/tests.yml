name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "static/**", "tests/**", "requirements.txt", "run.command", ".github/workflows/tests.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # macos-latest runs on Apple Silicon (ARM)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - name: run.command sets up and starts the app
        if: runner.os != 'Windows'
        run: |
          ./run.command > server.log 2>&1 &
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:8765/api/info > /dev/null && exit 0; sleep 2; done
          cat server.log; exit 1
