  <script>
    (function () {
      const S = '[data-composition-id="08-phone-teleprompter"] ';
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.4s): phone slides in from the right, tilt settles flat; eyebrow, then headline.
      tl.fromTo(S + ".phone", { x: 300, rotation: 5, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo(S + ".eyebrow", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.fromTo(S + "h2", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.8);

      // Scene 2 (1.4-2.6s): screen holds on the fresh answer (no tweens).

      // Scene 3 (2.6-5.0s): screen advances 00 -> 22 -> 44 -> 66, each a short upward scroll-crossfade.
      // Advance windows pre-computed once (dynamic-content-sequencing), spaced through the VO line.
      const FIRST_ADVANCE = 2.6;
      const STEP = 0.75;
      const SWAP = 0.45;
      const DRIFT = 22;
      const shots = gsap.utils.toArray(S + ".screen img");
      const ADVANCES = shots.slice(1).map((el, i) => ({ el, prev: shots[i], start: FIRST_ADVANCE + i * STEP }));
      ADVANCES.forEach(({ el, prev, start }) => {
        tl.fromTo(el, { y: DRIFT, opacity: 0 }, { y: 0, opacity: 1, duration: SWAP, ease: "power2.out" }, start);
        tl.fromTo(prev, { y: 0, opacity: 1 }, { y: -DRIFT, opacity: 0, duration: SWAP, ease: "power2.in", immediateRender: false }, start);
      });

      // With the first advance: "read" then "next" legend pills pop (smooth settle, no overshoot).
      gsap.utils.toArray(S + ".key").forEach((el, i) => {
        tl.fromTo(el, { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, FIRST_ADVANCE + i * 0.08);
      });

      // On "as you read": QR pill slides up.
      tl.fromTo(S + ".qr", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 4.4);

      // Scene 4 (5.0-6.027s): hold still on phone-read-66.

      window.__timelines = window.__timelines || {};
      window.__timelines["08-phone-teleprompter"] = tl;
    })();
