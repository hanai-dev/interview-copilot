  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="02-meet"]');
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.3s): accent line draws left to right (svg-path-draw), then the title slides up.
      const path = root.querySelector(".line path");
      const len = path.getTotalLength();
      path.style.strokeDasharray = `${len}`;
      tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.15);
      tl.fromTo(root.querySelector("h1"), { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.3);

      // Scene 2 (1.3-3.4s): verbs reveal one by one; start times pre-computed from content length
      // (dynamic-content-sequencing), accumulated rather than swapped so all three land.
      const BASE_DURATION = 0.4;
      const SEC_PER_CHAR = 0.03;
      const HOLD_MID = 0.1;
      const SEQ_START = 1.35;
      const verbs = Array.from(root.querySelectorAll(".verb"));
      let cumulative = SEQ_START;
      const TIMELINE = verbs.map((el) => {
        const start = cumulative;
        cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR + HOLD_MID;
        return { el, start };
      });
      TIMELINE.forEach(({ el, start }) => {
        tl.fromTo(el, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, start);
      });

      // Scene 3 (3.4-5.8s): app window rises into its slot on a long-tail settle, then holds still.
      const win = root.querySelector(".win");
      tl.fromTo(win, { y: 80 }, { y: 0, duration: 1.5, ease: "expo.out" }, 3.45);
      tl.fromTo(win, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-meet"] = tl;
    })();
