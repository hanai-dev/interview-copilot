  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="10-press-record"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const btn = q(".rec");
      const shape = q(".shape");
      const dot = q(".dot");
      const cursor = q(".cursor");

      // Scene 1 (0.0-1.2s) "Interview Copilot": rings draw outward from center (svg-path-draw),
      // accent line draws, wordmark slides up.
      root.querySelectorAll(".ring").forEach((ring, i) => {
        const len = ring.getTotalLength();
        ring.style.strokeDasharray = `${len}`;
        tl.fromTo(ring, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.0 + i * 0.14);
      });
      tl.fromTo(q(".line"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.05);
      tl.fromTo(q("h1"), { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.1);

      // Scene 2 (1.2-2.4s) "Try the demo interview": the red record dot pops at the pill's center,
      // then the pill condenses out around it (card-morph-anchor: one tween, uniform scale + paint),
      // the dot riding to its slot; "Record" fades in over the last 40% of the morph.
      const MORPH_START = 1.55;
      const MORPH_DUR = 0.8;
      tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 1.2);
      tl.fromTo(shape, { scale: 0, backgroundColor: "#C8372D" }, { scale: 1, backgroundColor: "#1B2430", duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
      tl.fromTo(dot, { x: 100.6 }, { x: 0, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
      tl.fromTo(q(".label-rec"), { opacity: 0 }, { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out" }, MORPH_START + MORPH_DUR * 0.6);

      // Scene 3 (2.4-3.3s) "then press Record": cursor decelerates in from lower-right,
      // tip landing a few px off the pill's center.
      tl.fromTo(cursor, { x: 1990, y: 830 }, { x: 968, y: 541, duration: 0.75, ease: "power3.out" }, 2.45);

      // Scene 4 (3.3-5.2s): lockstep press + spring release (physics-press-reaction), flip to Stop,
      // one soft ripple (cursor-click-ripple), colophon fades up, hold.
      const PRESS_AT = 3.3;
      const FLIP_AT = 3.36;
      tl.to([btn, cursor], { scale: 0.9, duration: 0.12, ease: "power1.in" }, PRESS_AT);
      tl.to([btn, cursor], { scale: 1, duration: 0.55, ease: "back.out(2)" }, PRESS_AT + 0.15);
      tl.to(shape, { backgroundColor: "#C8372D", duration: 0.3, ease: "power2.out" }, FLIP_AT);

      tl.fromTo(q(".label-stop"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, FLIP_AT + 0.14);

      tl.fromTo(ripple, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, FLIP_AT + 0.04);
