  <script>
    (function () {
      const ROOT = document.querySelector('[data-composition-id="01-mind-goes-blank"]');
      const q = (s) => ROOT.querySelector(s);
      const typed = q(".them .typed");
      const ghost = q(".them .ghost");
      const themCaret = q(".them .caret");
      const meCaret = q(".me-caret");

      const DUR = 3.731;
      const QUESTION = "Can you describe a time you had to deliver a project under a really tight deadline?";
      const T_TYPE0 = 0.3;   // bubble mostly settled, keystrokes begin
      const T_TYPE1 = 1.95;  // last keystroke, just after "tough question"
      const T_HANDOFF = 2.1; // "Your mind goes blank": Interviewer caret goes inert
      const ME_IN = 2.12;
      const BLINK0 = 2.36, BLINK1 = 3.56, BLINKS = 3; // three finite blinks, then hold still
      const THEM = "#2F5D8A", DIM = "#7B8592";

      // Discrete keystroke schedule: deterministic jitter + a beat at each word break,
      // normalised so the last key lands exactly on T_TYPE1.
      const gaps = Array.from(QUESTION, (ch, i) => 1 + 0.35 * Math.sin(i * 2.3) + (QUESTION[i - 1] === " " ? 1.4 : 0));
      const total = gaps.reduce((a, b) => a + b, 0);
      let acc = 0;
      const KEY_T = gaps.map((g) => T_TYPE0 + ((acc += g) / total) * (T_TYPE1 - T_TYPE0));

      // Pure function of time: seek-safe in either direction.
      function render(t) {
        let n = KEY_T.length;
        while (n > 0 && KEY_T[n - 1] > t) n--;
        typed.textContent = QUESTION.slice(0, n);
        ghost.textContent = QUESTION.slice(n);
        themCaret.style.background = t < T_HANDOFF ? THEM : DIM;
        const p = ((t - BLINK0) / (BLINK1 - BLINK0)) * Math.PI * 2 * BLINKS;
        meCaret.style.opacity = t >= BLINK0 && t < BLINK1 && Math.sin(p) > 0 ? "1" : "0";
      }

      const tl = gsap.timeline({ paused: true });
      // Scene 1: Interviewer bubble slides in on a long-tail settle, label trailing.
      tl.fromTo(q(".them"), { x: -220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 0);
      tl.fromTo(q(".them .who"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.12);
      // Scene 2: Me bubble rises in from its corner, smooth settle, no overshoot.
      tl.fromTo(q(".me"), { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, ME_IN);
      // Type-on + caret states, driven across the full frame.
      const driver = { t: 0 };
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(driver.t) }, 0);
      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-mind-goes-blank"] = tl;
    })();
