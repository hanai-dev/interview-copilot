  <div data-hf-id="hf-zr2b" id="root" data-composition-id="05-live-transcript" data-width="1920" data-height="1080" data-duration="3.633">

    <div data-hf-id="hf-5urm" id="f05-live-transcript-stage" class="stage clip" data-start="0" data-duration="3.633" data-track-index="1">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="05-live-transcript"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.6): short push-in toward the live row, long-tail settle onto the sketch framing.
      // ponytail: coordinate-target-zoom as one wrapper scaled about the row's centre (894,781) so the row holds
      // still while the window closes in; nested scale/translate wrappers only needed if the row must travel to canvas centre.
      tl.fromTo($(".cam"), { scale: 0.955 }, { scale: 1, duration: 1.0, ease: "expo.out" }, 0);

      // Scene 2 (0.3-2.3): grey interim words appear left to right under a row-tint cover that retreats word by word.
      // Edges are measured word gaps in the 3200px source; cover spans source x 60-650 (48-520px in the window).
      const COVER_L = 60, COVER_R = 650;
      const WORDS = [["Nice.", 143], ["Can", 206], ["you", 264], ["describe", 395], ["a", 420], ["time", 492], ["you", 550], ["had", 611], ["to", 650]];
      const BASE = 0.12, SEC_PER_CHAR = 0.03, WIPE = 0.09;
      const cover = $(".cover");
      let at = 0.3, prev = 1;
      WORDS.forEach(([word, edge]) => {
        const s = (COVER_R - edge) / (COVER_R - COVER_L);
        tl.fromTo(cover, { scaleX: prev }, { scaleX: s, duration: WIPE, ease: "power1.out", immediateRender: false }, at);
        prev = s;
        at += BASE + word.length * SEC_PER_CHAR;
      });

      // Outline fades in around the row with the first word; LIVE pill pops in (smooth, no overshoot).
      tl.fromTo($(".ring"), { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo($(".live"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.36);

      // Interviewer level bar moves while they speak, back to the screenshot's level (1 = 68% fill) by 2.2s.
      const LEVELS = [0.62, 1.28, 0.84, 1.4, 0.56, 1.18, 0.74, 1.34, 0.5, 1.22, 0.9, 1.44, 0.66, 1.12, 0.8, 1];
      const fill = $(".lvl b");
      let lv = 1;
      LEVELS.forEach((v, i) => {
        tl.fromTo(fill, { scaleX: lv }, { scaleX: v, duration: 0.12, ease: "sine.inOut", immediateRender: false }, 0.28 + i * 0.12);
        lv = v;
      });

      // Scene 3 (2.3-3.1): hold; the red LIVE dot dims and brightens twice (finite).
      const dot = $(".live i");
      [0.3, 1, 0.3, 1].forEach((o, i) => {
        tl.to(dot, { opacity: o, duration: 0.18, ease: "sine.inOut" }, 2.35 + i * 0.18);
      });

      tl.set({}, {}, 3.133);
      window.__timelines["05-live-transcript"] = tl;
    })();
  </script>
